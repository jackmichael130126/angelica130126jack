<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Te Amo Angélica❤️ - Mi Universo</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js para renderizado 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls para rotar la cámara -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div class="title-header">
    Te Amo Angélica 13/01/26<span>❤️</span>
  </div>

  <div class="footer-hint">
    Arrastra con el ratón o con el dedo para explorar el universo
  </div>

  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    scene.fog = new THREE.FogExp2(0x020005, 0.0015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 120);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;
    controls.maxDistance = 250;
    controls.minDistance = 20;

    function createGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');

      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.3, 'rgba(255,105,180,0.8)');
      gradient.addColorStop(0.7, 'rgba(255,20,147,0.3)');
      gradient.addColorStop(1, 'rgba(0,0,0,0)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 64, 64);

      return new THREE.CanvasTexture(canvas);
    }

    const glowTexture = createGlowTexture();

    // Corazón 3D
    const heartParticlesCount = 6000;
    const heartGeometry = new THREE.BufferGeometry();
    const heartPositions = new Float32Array(heartParticlesCount * 3);
    const heartColors = new Float32Array(heartParticlesCount * 3);

    for (let i = 0; i < heartParticlesCount; i++) {
      const t = Math.random() * Math.PI * 2;
      const u = (Math.random() - 0.5) * Math.PI;

      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      let z = u * 10;

      const factor = 1.8 + (Math.random() - 0.5) * 0.3;
      x *= factor;
      y *= factor;
      z *= factor;

      heartPositions[i * 3] = x;
      heartPositions[i * 3 + 1] = y;
      heartPositions[i * 3 + 2] = z;

      const color = new THREE.Color();
      color.setHSL(0.9 + Math.random() * 0.1, 1.0, 0.5 + Math.random() * 0.3);
      heartColors[i * 3] = color.r;
      heartColors[i * 3 + 1] = color.g;
      heartColors[i * 3 + 2] = color.b;
    }

    heartGeometry.setAttribute('position', new THREE.BufferAttribute(heartPositions, 3));
    heartGeometry.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));

    const heartMaterial = new THREE.PointsMaterial({
      size: 2.2,
      map: glowTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      vertexColors: true,
      depthWrite: false
    });

    const heartMesh = new THREE.Points(heartGeometry, heartMaterial);
    scene.add(heartMesh);

    // Galaxia de fondo
    const galaxyParticlesCount = 8000;
    const galaxyGeometry = new THREE.BufferGeometry();
    const galaxyPositions = new Float32Array(galaxyParticlesCount * 3);
    const galaxyColors = new Float32Array(galaxyParticlesCount * 3);

    for (let i = 0; i < galaxyParticlesCount; i++) {
      const radius = 30 + Math.random() * 180;
      const angle = Math.random() * Math.PI * 2;
      const height = (Math.random() - 0.5) * (radius * 0.4);

      galaxyPositions[i * 3] = Math.cos(angle) * radius;
      galaxyPositions[i * 3 + 1] = height - 20;
      galaxyPositions[i * 3 + 2] = Math.sin(angle) * radius;

      const color = new THREE.Color();
      if (Math.random() > 0.4) {
        color.setHSL(0.9 + Math.random() * 0.1, 0.8, 0.7);
      } else {
        color.setHSL(0.6 + Math.random() * 0.1, 0.5, 0.9);
      }
      
      galaxyColors[i * 3] = color.r;
      galaxyColors[i * 3 + 1] = color.g;
      galaxyColors[i * 3 + 2] = color.b;
    }

    galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(galaxyPositions, 3));
    galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(galaxyColors, 3));

    const galaxyMaterial = new THREE.PointsMaterial({
      size: 1.5,
      map: glowTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      vertexColors: true,
      depthWrite: false
    });

    const galaxyMesh = new THREE.Points(galaxyGeometry, galaxyMaterial);
    scene.add(galaxyMesh);

    // Frases flotantes
    const phrases = [
      "Mi universo",
      "Eres mi refugio",
      "Eres mi estrella",
      "Contigo por siempre",
      "Mi órbita eres tú",
      "Guiamos nuestros pasos juntos",
      "Siempre tú",
      "Mi mundo entero",
      "Te amo con el alma",
      "Nuestra historia eterna"
    ];

    function createTextSprite(text) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 128;

      ctx.font = 'Bold 36px "Segoe UI", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.shadowColor = 'rgba(255, 105, 180, 0.9)';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        blending: THREE.AdditiveBlending
      });

      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(30, 7.5, 1);
      return sprite;
    }

    phrases.forEach((phrase, index) => {
      const sprite = createTextSprite(phrase);
      const angle = (index / phrases.length) * Math.PI * 2 + (Math.random() * 0.4);
      const radius = 55 + Math.random() * 45;
      const y = (Math.random() - 0.5) * 50;

      sprite.position.x = Math.cos(angle) * radius;
      sprite.position.y = y;
      sprite.position.z = Math.sin(angle) * radius;

      scene.add(sprite);
    });

    // Animación
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      const scale = 1 + Math.sin(elapsedTime * 3) * 0.06;
      heartMesh.scale.set(scale, scale, scale);

      heartMesh.rotation.y = elapsedTime * 0.15;
      galaxyMesh.rotation.y = -elapsedTime * 0.05;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
